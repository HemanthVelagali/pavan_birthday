<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E57373" />
      <stop offset="50%" stop-color="#C62828" />
      <stop offset="100%" stop-color="#8E0000" />
    </linearGradient>
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF5350" />
      <stop offset="50%" stop-color="#D32F2F" />
      <stop offset="100%" stop-color="#9A0007" />
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFCDD2" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFCDD2" />
    </linearGradient>
  </defs>

  <!-- Shadow -->
  <ellipse cx="100" cy="180" rx="65" ry="12" fill="rgba(0,0,0,0.2)" />

  <!-- Main Box Body -->
  <rect x="35" y="85" width="130" height="90" rx="8" fill="url(#boxGrad)" stroke="#5C0000" stroke-width="2" />
  
  <!-- Vertical Ribbon on Body -->
  <rect x="86" y="85" width="28" height="90" fill="url(#ribbonGrad)" stroke="rgba(0,0,0,0.15)" stroke-width="1" />
  
  <!-- Lid -->
  <g id="gift-lid">
    <rect x="25" y="65" width="150" height="26" rx="6" fill="url(#lidGrad)" stroke="#5C0000" stroke-width="2" />
    <!-- Vertical Ribbon on Lid -->
    <rect x="86" y="65" width="28" height="26" fill="url(#ribbonGrad)" stroke="rgba(0,0,0,0.15)" stroke-width="1" />
    
    <!-- Ribbon Bow -->
    <!-- Left Loop -->
    <path d="M100 65 C70 35 45 40 55 60 C65 75 90 68 100 65 Z" fill="url(#ribbonGrad)" stroke="#E57373" stroke-width="1.5" />
    <!-- Right Loop -->
    <path d="M100 65 C130 35 155 40 145 60 C135 75 110 68 100 65 Z" fill="url(#ribbonGrad)" stroke="#E57373" stroke-width="1.5" />
    <!-- Center Knot -->
    <circle cx="100" cy="65" r="9" fill="#FFFFFF" stroke="#E57373" stroke-width="2" />
    <!-- Bow tails -->
    <path d="M96 68 Q80 85 70 95 L80 96 Q95 85 100 70 Z" fill="url(#ribbonGrad)" />
    <path d="M104 68 Q120 85 130 95 L120 96 Q105 85 100 70 Z" fill="url(#ribbonGrad)" />
  </g>
</svg>
