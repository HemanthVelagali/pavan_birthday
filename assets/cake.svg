<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="100%" height="100%" id="birthday-cake-svg">
  <defs>
    <!-- Cake Sponge Gradient -->
    <linearGradient id="cakeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3E0" />
      <stop offset="100%" stop-color="#FFE0B2" />
    </linearGradient>

    <!-- Frosting Cream Gradient -->
    <linearGradient id="frostingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF0F5" />
    </linearGradient>

    <!-- Chocolate / Strawberry Drip -->
    <linearGradient id="dripGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D81B60" />
      <stop offset="100%" stop-color="#AD1457" />
    </linearGradient>

    <!-- Candle Striped Pattern -->
    <pattern id="candleStripe" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#E53935" stroke-width="4" />
      <line x1="4" y1="0" x2="4" y2="8" stroke="#FFFFFF" stroke-width="4" />
    </pattern>

    <!-- Flame Glow Gradient -->
    <radialGradient id="flameInner" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FFEE58" />
      <stop offset="80%" stop-color="#FF9800" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
  </defs>

  <!-- Cake Stand -->
  <ellipse cx="180" cy="275" rx="140" ry="18" fill="#ECEFF1" stroke="#CFD8DC" stroke-width="3" />
  <path d="M150 275 L145 295 L215 295 L210 275 Z" fill="#CFD8DC" />

  <!-- Bottom Tier Cake -->
  <rect x="65" y="170" width="230" height="95" rx="16" fill="url(#cakeGrad)" stroke="#E0C0A0" stroke-width="2" />
  <!-- Bottom Frosting Layer -->
  <path d="M65 185 Q80 205 95 185 Q110 205 125 185 Q140 205 155 185 Q170 205 185 185 Q200 205 215 185 Q230 205 245 185 Q260 205 275 185 Q290 205 295 185 L295 170 L65 170 Z" fill="url(#frostingGrad)" />
  
  <!-- Top Tier Cake -->
  <rect x="100" y="95" width="160" height="75" rx="14" fill="url(#cakeGrad)" stroke="#E0C0A0" stroke-width="2" />
  <!-- Top Frosting Layer -->
  <path d="M100 110 Q115 128 130 110 Q145 128 160 110 Q175 128 190 110 Q205 128 220 110 Q235 128 250 110 Q258 122 260 110 L260 95 L100 95 Z" fill="url(#frostingGrad)" />

  <!-- Strawberries & Cherries Topping -->
  <g>
    <!-- Left Strawberry -->
    <path d="M115 90 C105 80 120 65 130 75 C140 85 125 98 115 90 Z" fill="#E53935" />
    <polygon points="122,72 126,67 130,72" fill="#4CAF50" />
    <!-- Center Strawberries -->
    <path d="M170 90 C160 80 175 65 185 75 C195 85 180 98 170 90 Z" fill="#E53935" />
    <polygon points="177,72 181,67 185,72" fill="#4CAF50" />
    <!-- Right Strawberry -->
    <path d="M225 90 C215 80 230 65 240 75 C250 85 235 98 225 90 Z" fill="#E53935" />
    <polygon points="232,72 236,67 240,72" fill="#4CAF50" />
  </g>

  <!-- 3 Birthday Candles -->
  <!-- Candle 1 (Left) -->
  <g class="candle" id="candle-1">
    <rect x="140" y="45" width="10" height="40" rx="3" fill="url(#candleStripe)" stroke="#999" stroke-width="0.5" />
    <line x1="145" y1="45" x2="145" y2="38" stroke="#333" stroke-width="2" />
    <!-- Flame -->
    <g class="flame-element" id="flame-1">
      <ellipse cx="145" cy="28" rx="8" ry="14" fill="url(#flameInner)" />
      <ellipse cx="145" cy="30" rx="4" ry="7" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Candle 2 (Center) -->
  <g class="candle" id="candle-2">
    <rect x="175" y="38" width="10" height="47" rx="3" fill="url(#candleStripe)" stroke="#999" stroke-width="0.5" />
    <line x1="180" y1="38" x2="180" y2="30" stroke="#333" stroke-width="2" />
    <!-- Flame -->
    <g class="flame-element" id="flame-2">
      <ellipse cx="180" cy="20" rx="9" ry="16" fill="url(#flameInner)" />
      <ellipse cx="180" cy="22" rx="4.5" ry="8" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Candle 3 (Right) -->
  <g class="candle" id="candle-3">
    <rect x="210" y="45" width="10" height="40" rx="3" fill="url(#candleStripe)" stroke="#999" stroke-width="0.5" />
    <line x1="215" y1="45" x2="215" y2="38" stroke="#333" stroke-width="2" />
    <!-- Flame -->
    <g class="flame-element" id="flame-3">
      <ellipse cx="215" cy="28" rx="8" ry="14" fill="url(#flameInner)" />
      <ellipse cx="215" cy="30" rx="4" ry="7" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Cake Sprinkles -->
  <g opacity="0.8">
    <circle cx="90" cy="220" r="3" fill="#FF4081" />
    <circle cx="120" cy="235" r="3" fill="#00E5FF" />
    <circle cx="160" cy="215" r="3" fill="#FFEB3B" />
    <circle cx="210" cy="230" r="3" fill="#76FF03" />
    <circle cx="250" cy="215" r="3" fill="#FF4081" />
    <circle cx="270" cy="235" r="3" fill="#FFB300" />
    <!-- Top tier sprinkles -->
    <circle cx="130" cy="140" r="2.5" fill="#00E5FF" />
    <circle cx="170" cy="145" r="2.5" fill="#FF4081" />
    <circle cx="210" cy="140" r="2.5" fill="#FFEB3B" />
    <circle cx="235" cy="148" r="2.5" fill="#76FF03" />
  </g>
</svg>
